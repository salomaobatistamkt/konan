# Konan na VPS (modo web): você fala pelo navegador do celular ou do PC.
# Cérebro por API (Groq gratuito por padrão); ouvido LOCAL (Whisper no próprio servidor, sem enviar áudio a ninguém);
# voz do próprio navegador. O modelo do Whisper é baixado na 1ª vez e fica guardado no volume /data.
name: konan

services:
  voz:
    build:
      context: ./voz
      args:
        PERFIL: leve
    restart: unless-stopped
    environment:
      KONAN_MODO: web
      KONAN_NOME: ${KONAN_NOME:-Konan}
      KONAN_SENHA: ${KONAN_SENHA:?defina KONAN_SENHA (mínimo 8 caracteres)}
      CEREBRO_URL: ${CEREBRO_URL:-https://api.groq.com/openai/v1}
      CEREBRO_MODELO: ${CEREBRO_MODELO:-llama-3.3-70b-versatile}
      CEREBRO_CHAVE: ${CEREBRO_CHAVE:?defina CEREBRO_CHAVE (chave da API)}
      OUVIDO_MOTOR: ${OUVIDO_MOTOR:-local}
      WHISPER_MODELO: ${WHISPER_MODELO:-base}
      WHISPER_THREADS: ${WHISPER_THREADS:-1}
      OUVIDO_URL: ${OUVIDO_URL:-https://api.groq.com/openai/v1}
      OUVIDO_MODELO: ${OUVIDO_MODELO:-whisper-large-v3-turbo}
      OUVIDO_CHAVE: ${OUVIDO_CHAVE:-}
      VOZ_MOTOR: navegador
      VOZ_VELOCIDADE: ${VOZ_VELOCIDADE:-1.05}
      TZ: ${TZ:-America/Sao_Paulo}
    expose:
      - "8090"
    volumes:
      - dados:/data
    mem_limit: 900m

volumes:
  dados:
