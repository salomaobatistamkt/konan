# Konan na VPS (modo web): você fala pelo navegador do celular ou do PC.
# Tudo no próprio servidor, sem chaves: cérebro pequeno (Qwen3 0,6B no llama.cpp), ouvido (Whisper) e voz do navegador.
# Os modelos são baixados na 1ª vez e ficam guardados em volumes. Para usar um cérebro por API (Groq/Gemini) em vez do
# local, defina CEREBRO_URL, CEREBRO_MODELO e CEREBRO_CHAVE.
name: konan

services:
  # Cérebro local pequeno (~0,5 GB). Limitado para não apertar os outros apps da VPS.
  cerebro:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /modelos
    command:
      - -hf
      - ${MODELO:-unsloth/Qwen3-0.6B-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${CONTEXTO:-2048}
      - --threads
      - ${THREADS:-1}
      - --parallel
      - "1"
      - --jinja
    expose:
      - "8080"
    volumes:
      - modelos-cerebro:/modelos
    mem_limit: 800m
    cpus: "0.8"

  voz:
    build:
      context: ./voz
      args:
        PERFIL: leve
    restart: unless-stopped
    environment:
      KONAN_MODO: web
      KONAN_NOME: ${KONAN_NOME:-Konan}
      KONAN_SENHA: ${KONAN_SENHA:?defina KONAN_SENHA (mínimo 8 caracteres)}
      CEREBRO_URL: ${CEREBRO_URL:-http://cerebro:8080/v1}
      CEREBRO_MODELO: ${CEREBRO_MODELO:-local}
      CEREBRO_CHAVE: ${CEREBRO_CHAVE:-}
      CEREBRO_MAX_TOKENS: ${CEREBRO_MAX_TOKENS:-200}
      OUVIDO_MOTOR: ${OUVIDO_MOTOR:-local}
      WHISPER_MODELO: ${WHISPER_MODELO:-base}
      WHISPER_THREADS: ${WHISPER_THREADS:-1}
      OUVIDO_URL: ${OUVIDO_URL:-https://api.groq.com/openai/v1}
      OUVIDO_MODELO: ${OUVIDO_MODELO:-whisper-large-v3-turbo}
      OUVIDO_CHAVE: ${OUVIDO_CHAVE:-}
      VOZ_MOTOR: ${VOZ_MOTOR:-kokoro}
      VOZ_VELOCIDADE: ${VOZ_VELOCIDADE:-1.05}
      TZ: ${TZ:-America/Sao_Paulo}
    expose:
      - "8090"
    volumes:
      - dados:/data
    mem_limit: 1100m

volumes:
  dados:
  modelos-cerebro:
